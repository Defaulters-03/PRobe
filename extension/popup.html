<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRobe - Pull Request Analyzer</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-subtle: #11141a;
      --fg: #e6e6e6;
      --muted: #8b95a5;
      --accent: #c8f135;
      --danger: #ff5a4f;
      --warning: #ffb224;
      --success: #2dd4bf;
      --card: #161b22;
      --border: #2a3038;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--fg);
      width: 320px;
      min-height: 200px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Layout */
    .container {
      padding: 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 svg {
      width: 20px;
      height: 20px;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
      width: 100%;
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--bg);
    }

    .btn-primary:hover {
      background-color: #b4e82e;
    }

    .btn-secondary {
      background-color: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      flex: 1;
      padding: 8px;
      background-color: var(--card);
      border-radius: 6px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 600;
      font-family: monospace;
    }

    .stat-label {
      font-size: 0.625rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Status indicator */
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
    }

    .status-dot.disconnected {
      background-color: var(--danger);
    }

    /* Options link */
    .options-link {
      display: block;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* Loading spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Recent PRs list */
    .pr-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .pr-item {
      padding: 8px;
      background-color: var(--card);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .pr-item:hover {
      background-color: var(--bg-subtle);
    }

    .pr-item-title {
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pr-item-meta {
      color: var(--muted);
      font-family: monospace;
      font-size: 0.625rem;
    }

    /* Error message */
    .error {
      padding: 8px;
      background-color: rgba(255, 90, 79, 0.1);
      border: 1px solid var(--danger);
      border-radius: 6px;
      color: var(--danger);
      font-size: 0.75rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
        PRobe
      </h1>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="spamCount">—</div>
        <div class="stat-label">Spam</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="lowEffortCount">—</div>
        <div class="stat-label">Low Effort</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="legitCount">—</div>
        <div class="stat-label">Legit</div>
      </div>
    </div>

    <button id="analyzeBtn" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Analyze Current PR
    </button>

    <div id="errorMessage" class="error" style="display: none;"></div>

    <div class="pr-list" id="prList"></div>

    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
    </div>

    <a href="options.html" class="options-link">Extension Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
